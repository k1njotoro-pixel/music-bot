<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hamster Kombat Clone</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0f131a;
      --card-bg: #1c2230;
      --text: #ffffff;
      --gold: #f59e0b;
      --accent: #3b82f6;
    }
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      border-bottom: 2px solid rgba(255,255,255,0.05);
    }
    .header-box {
      font-size: 13px;
      color: #94a3b8;
    }
    .header-box span {
      display: block;
      color: var(--text);
      font-weight: bold;
      font-size: 16px;
    }
    .main-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .balance-container {
      margin-bottom: 25px;
      text-align: center;
    }
    .balance {
      font-size: 42px;
      font-weight: 800;
      color: var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .tap-area {
      position: relative;
      width: 250px;
      height: 250px;
      border-radius: 50%;
      background: radial-gradient(circle, #f59e0b 0%, #b45309 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 110px;
      cursor: pointer;
      box-shadow: 0 0 35px rgba(245, 158, 11, 0.4);
      transition: transform 0.08s ease;
      touch-action: manipulation;
    }
    .tap-area:active {
      transform: scale(0.95);
    }
    .energy-bar-wrap {
      width: 80%;
      margin-top: 30px;
    }
    .energy-info {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      margin-bottom: 6px;
      color: #94a3b8;
    }
    .progress-track {
      background: #334155;
      height: 12px;
      border-radius: 6px;
      overflow: hidden;
    }
    .progress-fill {
      background: #38bdf8;
      height: 100%;
      width: 100%;
      transition: width 0.2s linear;
    }
    .tap-floating {
      position: absolute;
      color: #fff;
      font-weight: bold;
      font-size: 26px;
      pointer-events: none;
      animation: floatUp 0.8s ease-out forwards;
    }
    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-70px); }
    }
    nav {
      background: var(--card-bg);
      display: flex;
      justify-content: space-around;
      padding: 12px 0;
      border-top: 1px solid rgba(255,255,255,0.05);
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 11px;
      color: #94a3b8;
      cursor: pointer;
      gap: 4px;
    }
    .nav-item.active {
      color: var(--gold);
    }
    .page {
      display: none;
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }
    .page.active {
      display: block;
    }
    .upgrade-card {
      background: var(--card-bg);
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .upgrade-btn {
      background: var(--gold);
      color: #000;
      font-weight: bold;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-box">
      Прибыль в час
      <span id="p-hour">+100</span>
    </div>
    <div class="header-box">
      Уровень
      <span id="p-level">Хомяк-Новичок</span>
    </div>
  </header>

  <!-- Экран тапалки -->
  <main id="tap-page" class="main-screen">
    <div class="balance-container">
      <div class="balance">🪙 <span id="coins">0</span></div>
    </div>
    <div class="tap-area" id="hamster">🐹</div>
    <div class="energy-bar-wrap">
      <div class="energy-info">
        <span>⚡ Энергия</span>
        <span><b id="energy-val">1000</b> / 1000</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="energy-bar"></div>
      </div>
    </div>
  </main>

  <!-- Экран прокачки (Шахта) -->
  <div id="mine-page" class="page">
    <h3 style="margin-bottom: 12px;">У
